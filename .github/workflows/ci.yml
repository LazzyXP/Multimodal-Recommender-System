name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  core:
    name: test (core, no torch) · ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install core + dev dependencies
        run: uv sync --group dev --frozen
      - name: Lint
        run: uv run ruff check src tests
      - name: Test
        run: uv run pytest

  torch-smoke:
    name: test (torch, CPU) · ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install core + dev dependencies
        run: uv sync --group dev --frozen
      - name: Install torch (CPU index)
        run: uv pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Verify torch runtime is installed
        run: uv run python -c "import torch; print(f'torch={torch.__version__}, cuda={torch.version.cuda}, available={torch.cuda.is_available()}')"
      - name: Test torch model layer
        run: uv run pytest tests/test_torch_models.py -q
